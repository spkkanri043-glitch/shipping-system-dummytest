<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>出荷調整システム - 関ケ原プラ工業</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#0d1520;
  --dark2:#1a2535;
  --dark3:#243044;
  --accent:#e8a020;
  --accent2:#f0b840;
  --blue:#3a7bdc;
  --green:#1e8a55;
  --red:#c0392b;
  --orange:#b56e00;
  --text:#f0f4f8;
  --text2:#a0b0c0;
  --text3:#607080;
  --border:#2a3a50;
  --border2:#354a60;
  --card:#1e2d40;
  --card2:#243348;
  --radius:10px;
  --radius-sm:7px;
}
html,body{height:100%;background:var(--dark);color:var(--text);font-family:'Meiryo','Hiragino Kaku Gothic ProN',sans-serif;font-size:16px}
/* ── トップバー ── */
.topbar{background:var(--dark2);border-bottom:1px solid var(--border);padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-logo{width:34px;height:34px;border-radius:50%;background:rgba(232,160,32,.2);border:1px solid rgba(232,160,32,.4);display:flex;align-items:center;justify-content:center;font-size:15px}
.topbar-title{font-size:17px;font-weight:700;color:var(--text)}
.topbar-sub{font-size:12px;color:var(--text2)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-user{font-size:12px;color:var(--text2);white-space:nowrap}
.btn-top{font-size:12px;padding:6px 13px;border-radius:5px;border:1px solid var(--border2);background:rgba(255,255,255,.07);color:var(--text2);cursor:pointer;white-space:nowrap}
.btn-top:hover{background:rgba(255,255,255,.13);color:var(--text)}
.btn-top.danger{border-color:rgba(192,57,43,.5);background:rgba(192,57,43,.2);color:#f08070}
/* ── ナビ ── */
.nav{background:var(--dark2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-item{padding:11px 18px;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .18s;flex-shrink:0}
.nav-item.on{color:var(--accent);border-bottom-color:var(--accent)}
/* ── コンテンツ ── */
.content{padding:14px;max-width:900px;margin:0 auto}
.page{display:none}
.page.on{display:block}
/* ── カード ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:12px}
.card-title{font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card-title::before{content:'';width:3px;height:13px;background:var(--accent);border-radius:99px;display:inline-block}
/* ── フォーム ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.fl{font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:600;letter-spacing:.04em}
.fi{width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--dark3);color:var(--text);outline:none;font-family:inherit;-webkit-appearance:none;transition:border .2s}
.fi:focus{border-color:var(--accent)}
select.fi{cursor:pointer}
/* ── ボタン ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#1a1000}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--dark3);color:var(--text2);border:1px solid var(--border2)}
.btn-secondary:hover{background:var(--card2);color:var(--text)}
.btn-danger{background:rgba(192,57,43,.25);color:#f08070;border:1px solid rgba(192,57,43,.4)}
.btn-danger:hover{background:rgba(192,57,43,.4)}
.btn-blue{background:rgba(58,123,220,.25);color:#80b0f0;border:1px solid rgba(58,123,220,.4)}
.btn-blue:hover{background:rgba(58,123,220,.4)}
.btn-green{background:rgba(30,138,85,.25);color:#60d090;border:1px solid rgba(30,138,85,.4)}
.btn-green:hover{background:rgba(30,138,85,.4)}
.btn-sm{padding:6px 13px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* ── バッジ ── */
.badge{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.badge-pending{background:rgba(181,110,0,.25);color:#f0a030;border:1px solid rgba(181,110,0,.3)}
.badge-done{background:rgba(30,138,85,.25);color:#60d090;border:1px solid rgba(30,138,85,.3)}
.badge-mae{background:rgba(58,123,220,.25);color:#80b0f0;border:1px solid rgba(58,123,220,.3)}
.badge-ato{background:rgba(192,57,43,.25);color:#f08070;border:1px solid rgba(192,57,43,.3)}
.badge-cancel{background:rgba(96,112,128,.25);color:#a0b0c0;border:1px solid rgba(96,112,128,.3)}
/* ── ファイル選択 ── */
.file-list{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.file-item{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s}
.file-item:last-child{border-bottom:none}
.file-item:hover{background:var(--card2)}
.file-item.selected{background:rgba(232,160,32,.1);border-left:3px solid var(--accent)}
.file-name{font-size:14px;font-weight:600;color:var(--text);flex:1;word-break:break-all}
.file-date{font-size:12px;color:var(--text3);white-space:nowrap}
.file-label{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.label-pending{background:rgba(181,110,0,.25);color:#f0a030}
.label-new{background:rgba(58,123,220,.25);color:#80b0f0}
.label-mae{background:rgba(58,123,220,.2);color:#80b0f0}
.label-ato{background:rgba(192,57,43,.2);color:#f08070}
/* ── ステータスバー ── */
.status-bar{background:var(--dark3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 15px;font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.status-bar.ok{border-color:rgba(30,138,85,.4);background:rgba(30,138,85,.08);color:#60d090}
.status-bar.err{border-color:rgba(192,57,43,.4);background:rgba(192,57,43,.08);color:#f08070}
.status-bar.warn{border-color:rgba(181,110,0,.4);background:rgba(181,110,0,.08);color:#f0a030}
.status-bar.loading{border-color:rgba(232,160,32,.3);background:rgba(232,160,32,.05);color:var(--accent)}
/* ── 統計 ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;border-top:2px solid var(--border)}
.stat-box.blue{border-top-color:var(--blue)}
.stat-box.orange{border-top-color:var(--accent)}
.stat-box.green{border-top-color:var(--green)}
.stat-box.red{border-top-color:var(--red)}
.stat-num{font-size:27px;font-weight:700;color:var(--text);line-height:1.2}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:3px;letter-spacing:.04em}
/* ── モーダル ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:22px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.modal-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:15px;padding-bottom:11px;border-bottom:1px solid var(--border)}
.modal-footer{display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.modal-footer .btn{flex:1}
/* ── セクションヘッダー ── */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.section-hd-title{font-size:14px;font-weight:700;color:var(--text)}
/* ── アクションバー ── */
.action-bar{display:none;background:rgba(232,160,32,.1);border:1px solid rgba(232,160,32,.3);border-radius:var(--radius-sm);padding:11px 15px;margin-bottom:10px;align-items:center;gap:10px;flex-wrap:wrap}
.action-bar.show{display:flex}
.action-bar-count{font-size:14px;font-weight:700;color:var(--accent);flex:1}
/* ── グループヘッダー（出荷調整タブ：品番グループ） ── */
.group-hd{background:var(--dark3);border:1px solid var(--border);border-radius:var(--radius-sm) var(--radius-sm) 0 0;padding:9px 15px;font-size:13px;font-weight:700;color:var(--text);display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-top:10px}
.group-hd:hover{background:var(--card2)}
.group-body{border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);overflow:hidden;margin-bottom:0}
.rec-row{padding:10px 15px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;transition:background .12s}
.rec-row:last-child{border-bottom:none}
.rec-row:hover{background:var(--card2)}
.rec-row.selected{background:rgba(232,160,32,.07)}
.rec-check{width:17px;height:17px;flex-shrink:0;margin-top:2px;accent-color:var(--accent);cursor:pointer}
.rec-body{flex:1;min-width:0}
.rec-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;gap:6px}
.rec-hinban{font-size:14px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-bc{font-family:monospace;font-size:11px;color:var(--text3);margin-bottom:3px}
.rec-meta{font-size:12px;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap}
.rec-meta span{white-space:nowrap}
.rec-meta .nouhi{color:var(--accent);font-weight:600}
/* スクロール */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
/* レスポンシブ */
@media(max-width:600px){
  .form-grid,.form-grid-3{grid-template-columns:1fr}
  .stats-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- トップバー -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">📋</div>
    <div>
      <div class="topbar-title">出荷調整システム</div>
      <div class="topbar-sub">関ケ原プラ工業(株) — 管理者専用</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="topbar-user" id="disp-user">👤 読込中...</span>
    <button class="btn-top" data-csp-click="h0" data-csp-source-click="goPortal()">← ポータルへ</button>
    <button class="btn-top danger" data-csp-click="h1" data-csp-source-click="doLogout()">ログアウト</button>
  </div>
</div>

<!-- ナビ -->
<div class="nav">
  <div class="nav-item on" id="nav-adjust" data-csp-click="h2" data-csp-source-click="goPage('adjust')">📋 出荷調整</div>
</div>

<!-- ▼ 出荷調整ページ -->
<div class="content">
<div class="page on" id="page-adjust">

  <!-- ステータスバー -->
  <div class="status-bar loading" id="adj-status" style="display:none">⏳ 処理中...</div>

  <!-- Step1: ファイル選択 -->
  <div class="card" id="card-file">
    <div class="card-title">Step 1　納品ラベルCSVを選択</div>
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <button class="btn btn-primary" data-csp-click="h3" data-csp-source-click="loadDriveFiles()">☁️ ドライブから読込</button>
      <label class="btn btn-secondary" style="cursor:pointer">
        CSVを正本登録
        <input type="file" accept=".csv,.CSV" style="display:none" data-csp-change="h4" data-csp-source-change="loadLocalCSV(this)">
      </label>
      <button class="btn btn-secondary btn-sm" data-csp-click="h5" data-csp-source-click="clearLoaded()" style="margin-left:auto">🗑 クリア</button>
    </div>
    <div id="adjustment-requests"></div>
    <button class="btn btn-secondary btn-sm" data-csp-click="h6" data-csp-source-click="loadAdjustmentHistory_()">調整履歴</button>
    <div id="adjustment-history"></div>
    <button class="btn btn-secondary btn-sm" data-csp-click="h7" data-csp-source-click="loadPendingAdjustments_()">未完了要求を確認</button>
    <div id="drive-file-area" style="display:none">
      <div id="drive-file-list" class="file-list"></div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn btn-green" data-csp-click="h8" data-csp-source-click="loadSelectedDriveFile()">✅ 選択して読込</button>
        <button class="btn btn-secondary btn-sm" data-csp-click="h9" data-csp-source-click="document.getElementById('drive-file-area').style.display='none'">閉じる</button>
      </div>
    </div>
    <div id="loaded-chips" style="margin-top:8px;display:none">
      <div style="font-size:12px;color:var(--text3);margin-bottom:4px">読込済みファイル</div>
      <div id="chip-wrap"></div>
    </div>
  </div>

  <!-- Step2: データ一覧・選択 -->
  <div class="card" id="card-data" style="display:none">
    <div class="section-hd">
      <div class="card-title" style="margin:0">Step 2　調整対象を選択</div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <input type="text" class="fi" id="rec-search" placeholder="品番・BC検索" style="width:170px;font-size:13px;padding:7px 11px" data-csp-input="h10" data-csp-source-input="renderRecords()">
        <button class="btn btn-secondary btn-sm" data-csp-click="h11" data-csp-source-click="selectAll()">全選択</button>
        <button class="btn btn-secondary btn-sm" data-csp-click="h12" data-csp-source-click="deselectAll()">全解除</button>
      </div>
    </div>

    <!-- 統計 -->
    <div class="stats-row" id="stats-row">
      <div class="stat-box blue"><div class="stat-num" id="stat-total">0</div><div class="stat-lbl">総件数</div></div>
      <div class="stat-box orange"><div class="stat-num" id="stat-selected">0</div><div class="stat-lbl">選択中</div></div>
      <div class="stat-box red"><div class="stat-num" id="stat-mae">0</div><div class="stat-lbl">前倒し済</div></div>
      <div class="stat-box green"><div class="stat-num" id="stat-ato">0</div><div class="stat-lbl">後ろ倒し済</div></div>
    </div>

    <!-- アクションバー -->
    <div class="action-bar" id="action-bar">
      <div class="action-bar-count" id="action-count">0件選択中</div>
      <button class="btn btn-blue btn-sm" data-csp-click="h13" data-csp-source-click="openAdjModal('前倒し')">⏩ 前倒し</button>
      <button class="btn btn-danger btn-sm" data-csp-click="h14" data-csp-source-click="openAdjModal('後ろ倒し')">⏪ 後ろ倒し</button>
      <button class="btn btn-secondary btn-sm" data-csp-click="h15" data-csp-source-click="openAdjModal('キャンセル')">🚫 キャンセル</button>
    </div>

    <!-- フィルタ -->
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm filter-btn on" data-f="all" data-csp-click="h16" data-csp-source-click="setFilter('all',this)">すべて</button>
      <button class="btn btn-secondary btn-sm filter-btn" data-f="unadjusted" data-csp-click="h17" data-csp-source-click="setFilter('unadjusted',this)">未調整のみ</button>
      <button class="btn btn-secondary btn-sm filter-btn" data-f="mae" data-csp-click="h18" data-csp-source-click="setFilter('mae',this)">前倒し</button>
      <button class="btn btn-secondary btn-sm filter-btn" data-f="ato" data-csp-click="h19" data-csp-source-click="setFilter('ato',this)">後ろ倒し</button>
      <button class="btn btn-secondary btn-sm filter-btn" data-f="cancel" data-csp-click="h20" data-csp-source-click="setFilter('cancel',this)">キャンセル</button>
    </div>

    <div id="rec-body"></div>
  </div>

  <!-- Step3: 書き出し -->
  <div class="card" id="card-export" style="display:none">

</div>

<div class="modal-overlay" id="adj-modal">
  <div class="modal">
    <div class="modal-title" id="adj-modal-title">納期調整</div>

    </div>

<script>
// ============================================================
// 設定
// ============================================================
// セキュリティ改修：接続先は固定（?adjust_gas_url= / ?gas_url= 差し替えを撤去）。
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxZoEhqcpYbLyj-1EXvKtisWL3Wreb8_OwWVeyy4vUhB5t6PKC9HtCJWm1ESS8pabSSZg/exec';
const SESSION_KEY = 'shipping_session_v1';

// ══ SSO署名トークン（ポータルが #sso= で受け渡す） ══
const AUTH_TOKEN_KEY = 'kpk_adjust_shipping_v2';
let AUTH_TOKEN = (function() {
  try {
    const h = location.hash || '';
    const m = h.match(/[#&]sso=([^&]+)/);
    if (m) {
      const t = decodeURIComponent(m[1]);
      sessionStorage.setItem(AUTH_TOKEN_KEY, t);
      history.replaceState(null, '', location.pathname + location.search);
      return t;
    }
    return sessionStorage.getItem(AUTH_TOKEN_KEY) || '';
  } catch(e) { return ''; }
})();

function decodeTokenClaims_(t) {
  try {
    const p = String(t).split('.')[0];
    const b64 = p.replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(b64 + '==='.slice((b64.length + 3) % 4)))));
  } catch(e) { return null; }
}

function handleUnauthorized_() {
  try { sessionStorage.removeItem(AUTH_TOKEN_KEY); } catch(e) {}
  AUTH_TOKEN = ''; currentUser = null;
  showStatus('err', '認証が無効です。業務管理ポータルから入り直してください。');
}

// 全API：トークン付きPOST（text/plain）。getCSVはテキスト応答なので rawText:true で受ける。
async function gasCall_(action, payload, opts) {
  opts = opts || {};
  if (!AUTH_TOKEN) { handleUnauthorized_(); return null; }
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ...(payload || {}), action, appId:'shipping', token: AUTH_TOKEN })
    });
    if (opts.rawText) {
      const txt = await res.text();
      // 認証エラー時はJSON({error:'unauthorized'})が返る
      if (txt && txt.indexOf('"unauthorized"') !== -1) { handleUnauthorized_(); return null; }
      return txt;
    }
    const json = await res.json();
    if (json && json.error === 'unauthorized') { handleUnauthorized_(); return null; }
    return json;
  } catch(e) { throw new Error('通信結果を確認できません。同じ要求IDで再試行してください。'); }
}

let currentUser  = null;
let allRecords   = [];   // 読み込んだ全レコード
let selectedBCs  = new Set();
let filterMode   = 'all';
let expandedGrps = Object.create(null);
let batchSnapshot_ = null;
let pendingAdjustment_ = null;
let operationBusy_ = false;
let currentAdjType = '';
let loadedFileNames = [];

// ============================================================
// 起動処理
// ============================================================
(async function init() {
  try {
    const user=await gasCall_('whoami',{});
    if(!user||!user.ok||!['admin','master'].includes(user.role))throw new Error('管理者権限が必要です');
    currentUser={id:user.id,name:user.name||user.id,admin:true};
    enterApp();
    await loadPendingAdjustments_();
  }catch(e){showStatus('err',e.message);}
})();

function enterApp() {
  if (!currentUser || !currentUser.admin) {
    showStatus('err', '⛔ このページは管理者専用です。');
    document.querySelectorAll('.page').forEach(p => p.innerHTML = '');
    return;
  }
  document.getElementById('disp-user').textContent = '👤 ' + currentUser.name + '（管理者）';
}

function goPortal() {
  const raw=new URLSearchParams(window.location.search).get('portal_url');
  if(raw==='https://spkkanri043-glitch.github.io/shipping-system-dummytest/portal_index.html'){window.location.href=raw;return;}
  const fallback='https://script.google.com/macros/s/AKfycbFCgghA3bTbdj8NdWT1dwTilJEVYMpC8airu6VUt0pK16Ml_NCwd4xlGExy8vMoACH/exec';
  try {
    const url=new URL(raw||fallback);
    window.location.href=url.protocol==='https:'&&url.hostname==='script.google.com'&&!url.port&&!url.username&&!url.password?url.href:fallback;
  }catch(e){window.location.href=fallback;}
}

function doLogout() {
  if (!confirm('ログアウトしますか？')) return;
  try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
  try { sessionStorage.removeItem(AUTH_TOKEN_KEY); } catch(e) {}
  AUTH_TOKEN = '';
  goPortal();
}

// ============================================================
// ページ切替
// ============================================================
function goPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('on'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('on'));
  document.getElementById('page-' + p).classList.add('on');
  document.getElementById('nav-' + p).classList.add('on');
}

// ============================================================
// ステータス表示
// ============================================================
function showStatus(type, msg) {
  const el = document.getElementById('adj-status');
  el.style.display = 'flex';
  el.className = 'status-bar ' + type;
  el.textContent = msg;
  if (type === 'ok') setTimeout(() => el.style.display = 'none', 4000);
}

// ============================================================
// ドライブからファイル一覧取得
// ============================================================
async function loadDriveFiles() {
  if (!AUTH_TOKEN) { handleUnauthorized_(); return; }
  showStatus('loading', '⏳ ドライブからファイル一覧を取得中...');
  try {
    const data = await gasCall_('getFileList', {});
    renderAdjustmentRequests_(data && data.pendingRequests || []);
    if (!data) return;
    if (!data.ok) throw new Error(data.message);
    if (!data.files || !data.files.length) { showStatus('warn', 'ファイルが見つかりません'); return; }

    const area = document.getElementById('drive-file-area');
    const list = document.getElementById('drive-file-list');
    area.style.display = 'block';

    const pending = data.files.filter(f => f.folder === 'pending');
    const source  = data.files.filter(f => f.folder !== 'pending');

    let html = '';
    if (pending.length) {
      html += '<div style="padding:7px 14px;background:rgba(181,110,0,.15);font-size:11px;font-weight:700;color:#f0a030;letter-spacing:.05em">🔄 未完了フォルダ</div>';
      pending.forEach(f => {
        const lbl = f.label || '作業中';
        const lcls = lbl.includes('前倒し') ? 'label-mae' : lbl.includes('後ろ倒し') ? 'label-ato' : 'label-pending';
        html += `<div class="file-item" data-id="${escHtml(f.id)}" data-name="${escHtml(f.name)}" data-csp-click="h24" data-csp-source-click="toggleFileSelect(this)">
          <input type="checkbox" style="width:16px;height:16px;accent-color:var(--accent);flex-shrink:0" data-csp-click="h25" data-csp-source-click="event.stopPropagation();toggleFileSelect(this.closest('.file-item'))">
          <div style="flex:1;min-width:0"><div class="file-name">${escHtml(f.name)}</div><div class="file-date">${escHtml(f.updated)}</div></div>
          <span class="file-label ${lcls}">${escHtml(lbl)}</span>
        </div>`;
      });
    }
    if (source.length) {
      html += '<div style="padding:7px 14px;background:rgba(58,123,220,.15);font-size:11px;font-weight:700;color:#80b0f0;letter-spacing:.05em">🆕 読込元フォルダ</div>';
      source.forEach(f => {
        html += `<div class="file-item" data-id="${escHtml(f.id)}" data-name="${escHtml(f.name)}" data-csp-click="h26" data-csp-source-click="toggleFileSelect(this)">
          <input type="checkbox" style="width:16px;height:16px;accent-color:var(--accent);flex-shrink:0" data-csp-click="h27" data-csp-source-click="event.stopPropagation();toggleFileSelect(this.closest('.file-item'))">
          <div style="flex:1;min-width:0"><div class="file-name">${escHtml(f.name)}</div><div class="file-date">${escHtml(f.updated)}</div></div>
          <span class="file-label label-new">🆕 新規</span>
        </div>`;
      });
    }
    list.innerHTML = html;
    document.getElementById('adj-status').style.display = 'none';
  } catch(err) { showStatus('err', '❌ ' + err.message); }
}

function toggleFileSelect(item) {
  const cb = item.querySelector('input[type=checkbox]');
  cb.checked = !cb.checked;
  item.classList.toggle('selected', cb.checked);
}

async function loadSelectedDriveFile() {
  const checks=document.querySelectorAll('#drive-file-list .file-item input:checked');
  if(checks.length!==1){showStatus('err','1バッチだけ選択してください');return;}
  if(pendingAdjustment_){showStatus('err','未完了要求を先に再試行してください');return;}
  const item=checks[0].closest('.file-item');
  return loadAdjustmentBatch_(item.dataset.name.replace(/\.csv$/i,''));
}

async function loadLocalCSV(input) {
  if(operationBusy_||pendingAdjustment_){showStatus('err','未完了要求を先に再試行してください');return;}
  const files=Array.from(input.files);
  if(files.length!==1){showStatus('err','1つのCSVを選択してください');return;}
  try {
    pendingAdjustment_={action:'prepareBatch',payload:{requestId:crypto.randomUUID(),csvText:await files[0].text()}};
    await runAdjustmentOperation_();
  }catch(e){showStatus('err',e.message);}
  input.value='';
}

function parseAndMergeCSV(text, fname) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const lines   = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g,'').trim());
  const recs = lines.slice(1).map(line => {
    const cols = splitCSV(line); const obj = {};
    headers.forEach((h,i) => {
      let v = (cols[i]||'').trim().replace(/^"|"$/g,'').replace(/^=?"?([^"]*)"?$/,'$1').replace(/^=/,'');
      obj[h] = v;
    });
    if (obj['品番']) obj['品番'] = obj['品番'].replace(/-/g,'');
    if (!obj['消込済'])   obj['消込済']   = '未';
    if (!obj['消込日時']) obj['消込日時'] = '';
    if (!obj['納品調整']) obj['納品調整'] = '';
    obj['_origDate'] = obj['納品日'] || '';  // 変更前日付を保持
    return obj;
  }).filter(r => r['品番'] && r['バーコード番号']);

  const existingBCs = new Set(allRecords.map(r => r['バーコード番号']));
  recs.forEach(r => { if (!existingBCs.has(r['バーコード番号'])) allRecords.push(r); });
  if (!loadedFileNames.includes(fname)) loadedFileNames.push(fname);
}

function splitCSV(line) {
  const cols = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c==='"') inQ=!inQ;
    else if (c===',' && !inQ) { cols.push(cur); cur=''; }
    else cur+=c;
  }
  cols.push(cur);
  return cols;
}

function clearLoaded() {
  if(pendingAdjustment_||operationBusy_){showStatus('err','未完了要求を先に再試行してください');return;}
  batchSnapshot_=null;
  if (allRecords.length && !confirm('読み込んだデータをすべてクリアしますか？')) return;
  allRecords = []; selectedBCs.clear(); loadedFileNames = [];
  document.getElementById('card-data').style.display   = 'none';
  document.getElementById('card-export').style.display = 'none';
  document.getElementById('loaded-chips').style.display = 'none';
  document.getElementById('drive-file-area').style.display = 'none';
  showStatus('ok', 'クリアしました');
}

// ============================================================
// 表示更新
// ============================================================
function updateAll() {
  updateStats();
  renderRecords();
  updateChips();
  updateExportPreview();
  document.getElementById('card-data').style.display   = allRecords.length ? '' : 'none';
  document.getElementById('card-export').style.display = allRecords.length ? '' : 'none';
}

function updateStats() {
  const total    = allRecords.length;
  const selCount = selectedBCs.size;
  const mae      = allRecords.filter(r => r['納品調整'] === '前倒し').length;
  const ato      = allRecords.filter(r => r['納品調整'] === '後ろ倒し').length;
  document.getElementById('stat-total').textContent    = total;
  document.getElementById('stat-selected').textContent = selCount;
  document.getElementById('stat-mae').textContent      = mae;
  document.getElementById('stat-ato').textContent      = ato;
}

function updateChips() {
  const wrap = document.getElementById('loaded-chips');
  if (!loadedFileNames.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  document.getElementById('chip-wrap').innerHTML = loadedFileNames.map(n =>
    `<span style="display:inline-block;background:var(--dark3);border:1px solid var(--border);border-radius:99px;padding:4px 11px;font-size:12px;color:var(--text2);margin:2px">${escHtml(n)}</span>`
  ).join('');
}

function setFilter(mode, btn) {
  filterMode = mode;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('on', b === btn);
    b.style.borderColor = b === btn ? 'var(--accent)' : '';
    b.style.color       = b === btn ? 'var(--accent)' : '';
  });
  renderRecords();
}

function renderRecords() {
  const body   = document.getElementById('rec-body');
  const search = (document.getElementById('rec-search').value || '').toLowerCase();

  let list = allRecords.filter(r => {
    if (filterMode === 'unadjusted') return !r['納品調整'];
    if (filterMode === 'mae')        return r['納品調整'] === '前倒し';
    if (filterMode === 'ato')        return r['納品調整'] === '後ろ倒し';
    if (filterMode === 'cancel')     return r['納品調整'] === 'キャンセル';
    return true;
  });

  if (search) list = list.filter(r =>
    (r['品番']||'').toLowerCase().includes(search) ||
    (r['バーコード番号']||'').includes(search) ||
    (r['発注番号']||'').toLowerCase().includes(search)
  );

  if (!list.length) {
    body.innerHTML = '<div style="text-align:center;color:var(--text3);padding:32px">該当データなし</div>';
    return;
  }

  // 品番グループ
  const groups = Object.create(null); const order = [];
  list.forEach(r => {
    const hn = (r['品番'] || '(不明)');
    if (!groups[hn]) { groups[hn] = []; order.push(hn); }
    groups[hn].push(r);
  });

  const rows = [];
  order.forEach(hn => {
    const grp   = groups[hn];
    const adjCnt = grp.filter(r => r['納品調整']).length;
    const isOpen = expandedGrps[hn] !== false;
    rows.push(
      `<div class="group-hd" data-grp="${escHtml(hn)}">
        <span>${escHtml(hn)} <span style="font-size:12px;color:var(--text3);font-weight:400">${isOpen?'▲':'▼'}</span></span>
        <span style="font-size:12px;color:var(--text2)">${adjCnt > 0 ? `<span style="color:var(--accent)">${adjCnt}件調整済</span> / ` : ''}${grp.length}件</span>
      </div>`
    );
    if (!isOpen) return;
    rows.push('<div class="group-body">');
    grp.forEach(r => {
      const bc   = r['バーコード番号'] || '';
      const adj  = r['納品調整'] || '';
      const isSel = selectedBCs.has(bc);
      let adjBadge = '';
      if (adj === '前倒し')   adjBadge = '<span class="badge badge-mae">前倒し</span>';
      if (adj === '後ろ倒し') adjBadge = '<span class="badge badge-ato">後ろ倒し</span>';
      if (adj === 'キャンセル') adjBadge = '<span class="badge badge-cancel">キャンセル</span>';
      // ★F03：CSV由来値は全てエスケープ。onclick へ bc を埋め込まず data-bc＋委譲で扱う。
      rows.push(
        `<div class="rec-row${isSel?' selected':''}" data-bc="${escHtml(bc)}">
          <input type="checkbox" class="rec-check" ${isSel?'checked':''} tabindex="-1">
          <div class="rec-body">
            <div class="rec-top">
              <span class="rec-hinban">${escHtml(r['品番']||'')}</span>
              <span style="display:flex;gap:4px;align-items:center;flex-shrink:0">${adjBadge}</span>
            </div>
            <div class="rec-bc">${escHtml(bc)}</div>
            <div class="rec-meta">
              <span>数量:${escHtml(r['数量']||'')}</span>
              <span>連番:${escHtml(r['連番']||'')}/${escHtml(r['総数']||'')}</span>
              <span class="nouhi">納品日:${escHtml(r['納品日']||'')}</span>
              ${adj && r['_origDate'] && r['_origDate'] !== r['納品日'] ? `<span style="color:var(--text3)">変更前:${escHtml(r['_origDate'])}</span>` : ''}
              <span>発注:${escHtml(r['発注番号']||'')}</span>
              <span>納品先:${escHtml(r['納品先']||'')}</span>
            </div>
          </div>
        </div>`
      );
    });
    rows.push('</div>');
  });
  body.innerHTML = rows.join('');
  // ★F03：イベントは data-* + 委譲で設定（CSV文字列をJSソースへ埋め込まない）。
  if (!body._bound) {
    body.addEventListener('click', function (ev) {
      const gh = ev.target.closest && ev.target.closest('.group-hd');
      if (gh) { toggleGrp(gh.getAttribute('data-grp')); return; }
      const rr = ev.target.closest && ev.target.closest('.rec-row');
      if (rr) { toggleRec(rr.getAttribute('data-bc'), ev); }
    });
    body._bound = true;
  }
  updateActionBar();
}

function toggleGrp(hn) {
  expandedGrps[hn] = expandedGrps[hn] === false ? true : false;
  renderRecords();
}

function toggleRec(bc, e) {
  if (selectedBCs.has(bc)) selectedBCs.delete(bc); else selectedBCs.add(bc);
  updateStats();
  updateActionBar();
  renderRecords();
}

function selectAll() {
  allRecords.forEach(r => selectedBCs.add(r['バーコード番号']));
  updateStats(); updateActionBar(); renderRecords();
}
function deselectAll() {
  selectedBCs.clear();
  updateStats(); updateActionBar(); renderRecords();
}

function updateActionBar() {
  const bar = document.getElementById('action-bar');
  if (selectedBCs.size > 0) {
    bar.classList.add('show');
    document.getElementById('action-count').textContent = selectedBCs.size + '件選択中';
  } else {
    bar.classList.remove('show');
  }
}

// ============================================================
// 調整モーダル
// ============================================================
function openAdjModal(type) {
  if (!selectedBCs.size) { showStatus('warn', '対象を選択してください'); return; }
  currentAdjType = type;
  document.getElementById('adj-modal-title').textContent = type + '　納期調整';
  document.getElementById('adj-modal-count').textContent = selectedBCs.size + '件';

  // 変更前日付（選択中の代表日）
  const sel = allRecords.filter(r => selectedBCs.has(r['バーコード番号']));
  const dates = [...new Set(sel.map(r => r['_origDate'] || r['納品日'] || '').filter(Boolean))];
  document.getElementById('adj-modal-from').textContent = dates.join(', ') || '─';

  const newdateWrap = document.getElementById('adj-modal-newdate-wrap');
  newdateWrap.style.display = type === 'キャンセル' ? 'none' : '';

  document.getElementById('adj-modal-date').value = '';
  updateModalFname();
  document.getElementById('adj-modal').classList.add('show');
}

function closeAdjModal() { document.getElementById('adj-modal').classList.remove('show'); }

document.getElementById('adj-modal-date').addEventListener('input', updateModalFname);

function updateModalFname() {
  const type    = currentAdjType;
  const fromDts = document.getElementById('adj-modal-from').textContent;
  const toDt    = document.getElementById('adj-modal-date').value;
  function fmt(d) { if(!d) return '?'; const p=d.split('-'); return p[0]+'.'+parseInt(p[1])+'.'+parseInt(p[2]); }
  function fmtSlash(d) { if(!d) return '?'; const p=d.replace(/\//g,'-').split('-'); return p[0]+'.'+parseInt(p[1])+'.'+parseInt(p[2]); }
  const fromFmt = fromDts.split(',').map(d => fmtSlash(d.trim())).join('・');
  let name = '';
  if (type === 'キャンセル') name = 'キャンセル_' + fromFmt + '.csv';
  else name = type + '_' + fromFmt + '→' + fmt(toDt) + '.csv';
  document.getElementById('adj-modal-fname').textContent = name;
}

function applyAdj() {
  if(pendingAdjustment_||operationBusy_){showStatus('err','未完了要求を先に再試行してください');return;}
  const type   = currentAdjType;
  const toDt   = document.getElementById('adj-modal-date').value;
  if (type !== 'キャンセル' && !toDt) { alert('変更後の納品日を選択してください'); return; }
  const toDate = toDt ? toDt.replace(/-/g,'/') : '';

  selectedBCs.forEach(bc => {
    const idx = allRecords.findIndex(r => r['バーコード番号'] === bc);
    if (idx === -1) return;
    allRecords[idx]['納品調整'] = type;
    if (type !== 'キャンセル') allRecords[idx]['納品日'] = toDate;
  });

  closeAdjModal();
  selectedBCs.clear();
  updateAll();
  showStatus('warn', type + ' を選択しました（未保存）');
}

// ============================================================
// 書き出しプレビュー
// ============================================================
function updateExportPreview() {
  const mae      = allRecords.filter(r => r['納品調整'] === '前倒し');
  const ato      = allRecords.filter(r => r['納品調整'] === '後ろ倒し');
  const cancel   = allRecords.filter(r => r['納品調整'] === 'キャンセル');
  const unadj    = allRecords.filter(r => !r['納品調整']);

  function fmtDate(d) { return (d||'').replace(/\//g,'.').replace(/\.0(\d)/g,'.$1'); }

  const rows = [];
  if (mae.length) {
    const fromDates = [...new Set(mae.map(r => r['_origDate']||r['納品日']||''))].map(fmtDate).join('・');
    const toDates   = [...new Set(mae.map(r => r['納品日']||''))].map(fmtDate).join('・');
    rows.push({ label:'前倒し', count:mae.length, fname:'前倒し_' + fromDates + '→' + toDates + '.csv', color:'var(--blue)' });
  }
  if (ato.length) {
    const fromDates = [...new Set(ato.map(r => r['_origDate']||r['納品日']||''))].map(fmtDate).join('・');
    const toDates   = [...new Set(ato.map(r => r['納品日']||''))].map(fmtDate).join('・');
    rows.push({ label:'後ろ倒し', count:ato.length, fname:'後ろ倒し_' + fromDates + '→' + toDates + '.csv', color:'var(--red)' });
  }
  if (cancel.length) {
    const fromDates = [...new Set(cancel.map(r => r['_origDate']||r['納品日']||''))].map(fmtDate).join('・');
    rows.push({ label:'キャンセル', count:cancel.length, fname:'キャンセル_' + fromDates + '.csv', color:'var(--text3)' });
  }
  if (unadj.length) {
    rows.push({ label:'未調整（派生バッチへ継続）', count:unadj.length, fname:'─', color:'var(--accent)' });
  }

  const el = document.getElementById('export-preview');
  if (!rows.length) { el.innerHTML = ''; return; }
  el.innerHTML = rows.map(r =>
    `<div style="display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--dark3);border-radius:var(--radius-sm);margin-bottom:6px;font-size:13px">
      <span style="color:${r.color};font-weight:700;flex-shrink:0">${r.label}</span>
      <span style="color:var(--text3)">│</span>
      <span style="color:var(--text2)">${r.count}件</span>
      <span style="color:var(--text3)">│</span>
      <span style="font-family:monospace;color:var(--accent);font-size:12px;word-break:break-all">${escHtml(r.fname)}</span>
    </div>`
  ).join('');
}

// ============================================================
// ドライブに保存実行
// ============================================================
async function execExport() {
  if(pendingAdjustment_)return runAdjustmentOperation_();
  if(!batchSnapshot_){showStatus('err','元バッチを読み込んでください');return;}
  const changes=allRecords.filter(r=>r['納品調整']).map(r=>{
    const c={rowKey:r._rowKey,type:r['納品調整']};
    if(c.type!=='キャンセル')c.deliveryDate=r['納品日'];
    return c;
  });
  if(!changes.length){showStatus('err','調整対象がありません');return;}
  if(!confirm('この調整を確定しますか？'))return;
  pendingAdjustment_={action:'saveAdjustment',payload:{
    requestId:crypto.randomUUID(),batchId:batchSnapshot_.batchId,sourceFileId:batchSnapshot_.sourceFileId,
    version:batchSnapshot_.version,revision:batchSnapshot_.revision,records:batchSnapshot_.records,changes
  }};
  return runAdjustmentOperation_();
}

function getBaseFileName(filename) {
  let name = filename.replace(/\.(csv|CSV)$/i, '');
  let prev;
  do { prev = name; name = name.replace(/[_　]*(未完了|完了済|キャンセル|前倒し|後ろ倒し).*$/, ''); } while (name !== prev);
  return name;
}

// ============================================================
// ユーティリティ
// ============================================================
function pad(n) { return String(n).padStart(2,'0'); }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function loadAdjustmentBatch_(batchId) {
  try {
    const batch=await gasCall_('getBatch',{batchId});
    if(!batch||!batch.ok)throw new Error(batch&&batch.message||'バッチ読込失敗');
    batchSnapshot_=JSON.parse(JSON.stringify(batch));
    allRecords=batch.records.map(r=>({...r,_origDate:r['納品日']}));
    loadedFileNames=[batch.batchId+'.csv'];selectedBCs.clear();updateAll();
    showStatus('ok','読込済み: '+batch.batchId);
  }catch(e){showStatus('err',e.message);}
}
async function runAdjustmentOperation_() {
  if(operationBusy_||!pendingAdjustment_)return;
  operationBusy_=true;
  const operation=pendingAdjustment_;
  showStatus('loading','保存中 / 要求ID: '+operation.payload.requestId);
  try {
    const result=await gasCall_(operation.action,operation.payload);
    if(!result||!result.ok){
      const receipt=await gasCall_('getBatch',{requestId:operation.payload.requestId});
      if(receipt&&!receipt.ok&&receipt.message==='REQUEST_NOT_OWNED')pendingAdjustment_=null;
      throw new Error(result&&result.message||'保存未完了');
    }
    pendingAdjustment_=null;
    const live=(result.results||[]).find(r=>r.state==='ACTIVE');
    allRecords=[];selectedBCs.clear();loadedFileNames=[];batchSnapshot_=null;updateAll();
    if(live)await loadAdjustmentBatch_(live.batchId);
    const notificationFailed=result.notification&&!result.notification.ok;
    showStatus(notificationFailed?'warn':'ok','保存済み / '+(result.results||[]).map(r=>r.state+': '+r.batchId+' ('+r.count+'件)').join(' / ')+(notificationFailed?' / 通知結果は未確認です':''));
  }catch(e){
    showStatus('err',e.message+' / 要求ID: '+operation.payload.requestId);
  }finally{
    operationBusy_=false;
    if(pendingAdjustment_)renderAdjustmentRequests_([{requestId:operation.payload.requestId,kind:operation.action==='prepareBatch'?'prepare':'adjust'}]);
    else await loadPendingAdjustments_();
  }
}
async function loadPendingAdjustments_() {
  try {
    const result=await gasCall_('getFileList',{});
    if(result&&result.ok)renderAdjustmentRequests_(result.pendingRequests||[]);
    else if(result)showStatus('err',result.message||'要求一覧を取得できません');
  }catch(e){showStatus('err',e.message);}
}
function renderAdjustmentRequests_(items) {
  const box=document.getElementById('adjustment-requests');box.replaceChildren();
  items.forEach(item=>{
    const button=document.createElement('button');button.type='button';button.className='btn btn-secondary btn-sm';
    button.style.cssText='max-width:100%;overflow-wrap:anywhere;margin:6px 0';
    button.textContent='再開: '+item.requestId;
    button.onclick=async()=>{
      if(operationBusy_)return;
      try{
        const result=await gasCall_('getBatch',{requestId:item.requestId});
        if(!result||!result.ok)throw new Error(result&&result.message||'要求を取得できません');
        pendingAdjustment_={action:result.operation.kind==='prepare'?'prepareBatch':'saveAdjustment',payload:result.operation.payload};
        await runAdjustmentOperation_();
      }catch(e){showStatus('err',e.message);}
    };
    box.appendChild(button);
  });
}

async function loadAdjustmentHistory_() {
  try {
    const data=await gasCall_('getAdjustmentHistory',{});
    if(!data||!data.ok)throw new Error(data&&data.message||'履歴読込失敗');
    const box=document.getElementById('adjustment-history');box.replaceChildren();
    data.records.slice().reverse().forEach(record=>{
      const entry=document.createElement('details'),summary=document.createElement('summary'),body=document.createElement('pre');
      summary.textContent=record.state+' / '+record.requestId;
      body.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;padding:8px';
      body.textContent=JSON.stringify({actor:record.actor,parent:record.plan&&record.plan.parent,changes:record.plan&&record.plan.changes,result:record.result},null,2);
      entry.appendChild(summary);entry.appendChild(body);box.appendChild(entry);
    });
  }catch(e){showStatus('err',e.message);}
}
</script>

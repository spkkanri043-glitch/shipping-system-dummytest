<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'sha256-8uREY1bqciIvza+Pxbi8niCNvMN2Rys6Kcx77MVvdis='; script-src-attr 'none'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; frame-src 'none'; form-action 'none'">

<title>実習生勉強会の議事録 | 関ケ原プラ工業(株)</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --pr: #1a3a5c; --prl: #2a5a8c; --ac: #e8a020;
  --bg: #edf1f6; --sf: #fff; --sf2: #f2f6fb; --sf3: #e8edf4;
  --tx: #1a2332; --tx2: #5a6a7a; --tx3: #9aabb8;
  --bd: #cfd9e6; --bd2: #adbace;
  --g: #0b7a3d; --gbg: #e3f6ed;
  --a: #b07000; --abg: #fff7db;
  --r: #b53030; --rbg: #fce8e8;
  --b: #1655b0; --bbg: #e5effe;
  --rad: 10px; --rads: 7px;
}
html { -webkit-text-size-adjust: 100%; }
.hid { display: none !important; }
body { font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; background: var(--bg); color: var(--tx); font-size: 14px; -webkit-font-smoothing: antialiased; padding-bottom: 40px; }

.topbar { background: var(--pr); padding: 0 14px; height: 48px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.28); position: sticky; top: 0; z-index: 100; gap: 8px; }
.tbl { display: flex; align-items: center; gap: 8px; min-width: 0; flex-shrink: 1; }
.tbic { width: 30px; height: 30px; border-radius: 50%; background: rgba(232,160,32,.2); border: 1px solid rgba(232,160,32,.4); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.tbco { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbmd { font-size: 10px; color: rgba(255,255,255,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbr { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.user-name { font-size: 11px; color: rgba(255,255,255,.85); white-space: nowrap; }
.badge-role { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.22); white-space: nowrap; flex-shrink: 0; }
.badge-role:empty { display: none; }
#btn-close-tab { white-space: nowrap; flex-shrink: 0; }

.content { padding: 14px; max-width: 900px; margin: 0 auto; }
.notice-card { background: var(--abg); border: 1px solid rgba(176,112,0,.25); border-radius: var(--rad); padding: 12px 14px; margin-bottom: 14px; font-size: 12px; color: var(--tx2); line-height: 1.7; }
.notice-card b { color: var(--a); }
.banner { background: var(--rbg); border: 1px solid rgba(181,48,48,.35); color: var(--r); border-radius: var(--rad); padding: 12px 14px; margin-bottom: 14px; font-size: 13px; line-height: 1.7; font-weight: 600; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.toolbar-top { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.toolbar-top h1 { font-size: 16px; color: var(--pr); }

.card { background: var(--sf); border: 1px solid var(--bd); border-radius: var(--rad); padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
.card-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--bd); color: var(--pr); display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.list-item { background: var(--sf); border: 1px solid var(--bd); border-radius: var(--rad); padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.04); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.list-item:active, .list-item:focus { background: var(--sf2); outline: none; }
.list-item-title { font-size: 14px; font-weight: 700; color: var(--pr); }
.list-item-sub { font-size: 11px; color: var(--tx2); margin-top: 4px; }
.list-item-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: var(--gbg); color: var(--g); white-space: nowrap; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.form-grid.full { grid-template-columns: 1fr; }
.fg { margin-bottom: 2px; }
.fl { font-size: 12px; color: var(--tx2); display: block; margin-bottom: 4px; font-weight: 500; }
.fl.req::after { content: ' *'; color: var(--r); }
.fi { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--bd2); border-radius: var(--rads); background: #f8fafc; color: var(--tx); outline: none; font-family: inherit; -webkit-appearance: none; appearance: none; }
.fi:focus { border-color: var(--pr); }
textarea.fi { resize: vertical; min-height: 80px; }

.btn { padding: 9px 16px; font-size: 13px; font-weight: 600; border-radius: var(--rads); cursor: pointer; border: 1px solid var(--bd2); background: var(--sf2); color: var(--tx); font-family: inherit; -webkit-appearance: none; }
.btn.pri { background: var(--pr); color: #fff; border-color: transparent; }
.btn.pri:active { background: var(--prl); }
.btn.gold { background: var(--ac); color: #fff; border-color: transparent; }
.btn.danger { background: var(--r); color: #fff; border-color: transparent; }
.btn.sm { padding: 6px 12px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.chip-picker { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px solid var(--bd2); border-radius: var(--rads); background: #f8fafc; max-height: 160px; overflow-y: auto; min-height: 38px; }
.chip { font-size: 12px; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--bd2); background: var(--sf); cursor: pointer; user-select: none; white-space: nowrap; font-family: inherit; color: var(--tx); }
.chip.on { background: var(--pr); color: #fff; border-color: var(--pr); }
.chip.fixed { cursor: default; background: var(--sf3); color: var(--tx2); }

.attend-box { background: var(--gbg); border: 1px solid rgba(11,122,61,.25); border-radius: var(--rad); padding: 14px 16px; margin-bottom: 14px; }
.attend-box-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
.attend-box-head h3 { font-size: 13px; color: var(--g); }
.attend-list { display: flex; flex-wrap: wrap; gap: 6px; }
.attend-pill { font-size: 11.5px; padding: 4px 10px; border-radius: 20px; background: var(--sf); border: 1px solid rgba(11,122,61,.3); color: var(--tx); }
.attend-pill b { color: var(--g); }
.attend-empty { font-size: 12px; color: var(--tx2); }

.detail-block { margin-bottom: 14px; }
.detail-label { font-size: 11px; color: var(--tx3); font-weight: 700; margin-bottom: 4px; letter-spacing: .04em; }
.detail-body { font-size: 13.5px; white-space: pre-wrap; line-height: 1.7; color: var(--tx); }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 6px; }
.photo-thumb { width: 100%; height: 90px; border-radius: var(--rads); border: 1px solid var(--bd); background: var(--sf2); color: var(--tx3); font-size: 11px; cursor: pointer; overflow: hidden; padding: 0; font-family: inherit; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.att-note { font-size: 12px; color: var(--tx2); }
.file-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--tx); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: all .25s; z-index: 999; pointer-events: none; max-width: 90vw; text-align: center; line-height: 1.6; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--r); }
.toast.success { background: var(--g); }

#loading { position: fixed; inset: 0; background: rgba(255,255,255,.75); display: flex; align-items: center; justify-content: center; z-index: 1000; font-size: 13px; color: var(--pr); font-weight: 700; }
#viewer { position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 1100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 10px; }
#viewer img { max-width: 100%; max-height: calc(100vh - 90px); object-fit: contain; background: #fff; }

@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tbl">
    <div class="tbic">📖</div>
    <div>
      <div class="tbco">実習生勉強会の議事録</div>
      <div class="tbmd">関ケ原プラ工業(株)</div>
    </div>
  </div>
  <div class="tbr">
    <span class="user-name" id="disp-name">確認中…</span>
    <span class="badge-role" id="disp-role"></span>
    <button type="button" class="btn sm" id="btn-close-tab">閉じる</button>
  </div>
</div>

<div class="content">

  <div id="auth-banner" class="banner hid"><span id="auth-banner-text"></span><button type="button" class="btn sm hid" id="btn-retry">もう一度</button></div>

  <!-- ============ 一覧画面 ============ -->
  <div id="view-list">
    <div class="notice-card">
      打ち合わせの議事録を共有するアプリです。議事録の作成・更新のほか、各自「参加する」ボタンで参加ログを残せます。
    </div>
    <div class="toolbar-top">
      <h1>実習生勉強会 一覧</h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn sm hid" id="btn-import">📥 CSV取込</button>
        <input type="file" id="csv-import-input" accept=".csv,text/csv" class="hid">
        <button type="button" class="btn sm hid" id="btn-export">📤 CSV書き出し</button>
        <button type="button" class="btn pri sm hid" id="btn-new">＋ 新規作成</button>
      </div>
    </div>
    <div id="list-container"><div class="attend-empty">読み込み中...</div></div>
  </div>

  <!-- ============ 詳細/編集画面 ============ -->
  <div id="view-detail" class="hid">
    <button type="button" class="btn sm" style="margin-bottom:12px" id="btn-back">← 一覧に戻る</button>

    <!-- 表示モード -->
    <div id="detail-view-mode">
      <div class="card">
        <div class="card-title">
          <span id="d-title">-</span>
          <span style="display:flex;gap:6px;flex-shrink:0">
            <button type="button" class="btn sm hid" id="btn-edit">編集</button>
            <button type="button" class="btn sm danger hid" id="btn-delete">削除</button>
          </span>
        </div>
        <div class="detail-block"><div class="detail-label">開催日時 〜 終了日時</div><div class="detail-body" id="d-datetime">-</div></div>
        <div class="detail-block"><div class="detail-label">作成者</div><div class="detail-body" id="d-creator">-</div></div>
        <div class="detail-block"><div class="detail-label">参加者(手動選択)</div><div class="detail-body" id="d-participants">-</div></div>
        <div class="detail-block"><div class="detail-label">参加者以外の通知先</div><div class="detail-body" id="d-notify">-</div></div>
        <div class="detail-block"><div class="detail-label">内容</div><div class="detail-body" id="d-content">-</div></div>
        <div class="detail-block"><div class="detail-label">決定事項</div><div class="detail-body" id="d-decisions">-</div></div>
        <div class="detail-block"><div class="detail-label">課題・困りごと</div><div class="detail-body" id="d-issues">-</div></div>
        <div class="detail-block"><div class="detail-label">改善状況写真</div><div class="photo-grid" id="d-photos"></div></div>
        <div class="detail-block"><div class="detail-label">勉強会資料 / 勉強会の様子</div><div class="detail-body file-row" id="d-files">-</div></div>
        <div class="detail-block"><div class="detail-label">次回予定日</div><div class="detail-body" id="d-nextdate">-</div></div>
      </div>

      <!-- 参加ログ(自己申告) -->
      <div class="attend-box">
        <div class="attend-box-head">
          <h3>参加ログ(自己申告)</h3>
          <button type="button" class="btn gold sm" id="btn-checkin" disabled>参加する</button>
        </div>
        <div class="attend-list" id="attend-list"><span class="attend-empty">まだ参加登録がありません</span></div>
      </div>
    </div>

    <!-- 編集/新規作成フォーム -->
    <div id="detail-edit-mode" class="hid">
      <div class="card">
        <div class="card-title" id="edit-form-title">議事録の編集</div>
        <div class="form-grid full">
          <div class="fg"><label class="fl" for="f-title">タイトル</label><input class="fi" id="f-title" maxlength="200" placeholder="例: 2026年7月20日　実習生勉強会"></div>
        </div>
        <div class="form-grid" style="margin-top:12px">
          <div class="fg"><label class="fl req" for="f-createdAt">開催日時</label><input class="fi" type="datetime-local" id="f-createdAt"></div>
          <div class="fg"><label class="fl req" for="f-endAt">終了日時</label><input class="fi" type="datetime-local" id="f-endAt"></div>
        </div>

        <div class="fg" style="margin-top:12px">
          <label class="fl">参加者(手動選択)</label>
          <div class="chip-picker" id="picker-participants"></div>
        </div>
        <div class="fg" style="margin-top:12px">
          <label class="fl">参加者以外の通知先</label>
          <div class="chip-picker" id="picker-notify"></div>
        </div>

        <div class="form-grid full" style="margin-top:12px">
          <div class="fg"><label class="fl" for="f-content">内容</label><textarea class="fi" id="f-content" maxlength="10000"></textarea></div>
          <div class="fg"><label class="fl" for="f-decisions">決定事項</label><textarea class="fi" id="f-decisions" maxlength="10000"></textarea></div>
          <div class="fg"><label class="fl" for="f-issues">課題・困りごと</label><textarea class="fi" id="f-issues" maxlength="10000"></textarea></div>
        </div>

        <div class="notice-card hid" id="attach-note" style="margin-top:12px"></div>
        <div class="form-grid" style="margin-top:12px">
          <div class="fg attach-field"><label class="fl" for="f-photo1">改善状況写真1</label><input class="fi" type="file" accept="image/*" id="f-photo1" data-field="photo1"></div>
          <div class="fg attach-field"><label class="fl" for="f-photo2">改善状況写真2</label><input class="fi" type="file" accept="image/*" id="f-photo2" data-field="photo2"></div>
          <div class="fg attach-field"><label class="fl" for="f-photo3">改善状況写真3</label><input class="fi" type="file" accept="image/*" id="f-photo3" data-field="photo3"></div>
          <div class="fg attach-field"><label class="fl" for="f-material">勉強会資料（PDF か画像）</label><input class="fi" type="file" accept="application/pdf,image/*" id="f-material" data-field="material"></div>
          <div class="fg attach-field"><label class="fl" for="f-scene">勉強会の様子</label><input class="fi" type="file" accept="image/*" id="f-scene" data-field="scene"></div>
          <div class="fg"><label class="fl req" for="f-nextDate">次回予定日</label><input class="fi" type="date" id="f-nextDate"></div>
        </div>

        <div style="display:flex;gap:8px;margin-top:16px">
          <button type="button" class="btn pri" id="btn-save">保存</button>
          <button type="button" class="btn" id="btn-cancel">キャンセル</button>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="loading" class="hid">処理中...</div>
<div class="toast" id="toast" role="status"></div>
<div id="viewer" class="hid"><img id="viewer-img" alt="添付の画像"><button type="button" class="btn sm" id="btn-viewer-close">閉じる</button></div>

<script>
'use strict';
// ==============================================================
// ★2026-10-31 セキュリティ修正（田中さんの指示書 S02・S03・S04・候補）
//   - 接続先の GAS は生成のときに固定する（build_apps.py が BENKYOKAI_GAS_URL を置き換える）。
//     URL の引数・本文・応答から接続先を選ばない。形が違えば通信しないで止める。
//   - 入場券は URL の # の後ろ（#sso=）でだけ受け取り、読んだらすぐ URL から消す。メモリにだけ持つ（保存しない・ログに出さない）。
//     受け取っただけでは本人と扱わない：GAS の whoami が確かめた名前・役割だけを出す。旧の ?sso=（署名なし）は読まない。
//   - ボタンは addEventListener。利用者の文字は textContent で出す（HTML・JavaScript として差し込まない）。
//     添付は GAS が入場券を確かめて返した中身を Blob にして出す（URL のリンク・外の画像は出さない）。
//   - 入場券が使えない（unauthorized）と言われたら、入場券・一覧・詳細・名簿・入力・選んだファイル・作った Blob の URL を消し、
//     それより前に出した要求の応答は使わない。一時の障害（unavailable・busy・通信）は入力と入場券を残す。自動で送り直さない。
// ★2026-11-02 添付の3点（指示書 R02・R03）
//   - 添付を選んだときの欄の版（詳細の ver。新規は ''）を取っておき、送り直しでも同じ版を送る（GAS は欄が変わっていたら上書きしない）。
//   - 確認中（attach_pending）・競合（attach_conflict）・確定できない（attach_undetermined）は成功と出さない。
//     確認中は同じ requestId のまま残す。競合と確定できないは、その添付を送り直さない（確定できないは人が確かめるまで進まない）。共有を確かめられないときは、次は新しい requestId で送る。
// ==============================================================
const BENKYOKAI_GAS_URL = 'https://script.google.com/macros/s/AKfycbxGJw8illfxFh3Qjr7HGg8cCKBEYYqxNnSyvqj7hx0jLMiGJ_GS3ovhzGGxgGH85mmOXg/exec';
const GAS_URL_RE_ = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{1,200}\/exec$/;
const UUID_RE_ = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
const TOKEN_RE_ = /^[A-Za-z0-9_-]{1,1900}\.[A-Za-z0-9_-]{20,100}$/;
const VER_RE_ = /^(?:|v[0-9a-f]{16})$/;   // 添付の欄の版（空の欄は ''）
// 操作ごとの書き込みの有無と待つ時間（ミリ秒）。表に無い操作は送らない
const ACTIONS_ = {
  whoami: { write: false, timeout: 30000 }, getMinutesList: { write: false, timeout: 60000 },
  getMinutesDetail: { write: false, timeout: 60000 }, getEmployeeMaster: { write: false, timeout: 60000 },
  getMinutesExport: { write: false, timeout: 120000 }, getAttachment: { write: false, timeout: 120000 },
  saveMinutes: { write: true, timeout: 90000 }, importMinutes: { write: true, timeout: 180000 },
  checkIn: { write: true, timeout: 60000 }, uploadPhoto: { write: true, timeout: 180000 },
  deleteMinutes: { write: true, timeout: 180000 }   // ★2026-11-09 マスター管理者だけ（決めるのは GAS）
};
const KNOWN_ERRORS_ = ['unavailable', 'busy', 'invalid_data', 'not_found', 'limit_exceeded', 'sheet_unavailable', 'schema_mismatch',
  'attachments_stopped', 'attach_not_configured', 'attach_folder_shared', 'operation_failed',
  'attach_unverifiable', 'attach_pending', 'attach_undetermined', 'attach_conflict', 'delete_incomplete'];
const FIELDS_ = [['photo1', '改善状況写真1'], ['photo2', '改善状況写真2'], ['photo3', '改善状況写真3'], ['material', '勉強会資料'], ['scene', '勉強会の様子']];
const ROLE_LABELS_ = { staff: '一般', leader: 'リーダー', admin: '管理者', master: 'マスター管理者' };
const ATT_MIME_ = ['image/jpeg', 'image/png', 'application/pdf'];
const IMG_MAX_SIDE_ = 1600, IMG_QUALITY_ = 0.85, IMG_MAX_BYTES_ = 3000000, PDF_MAX_BYTES_ = 5000000, FILE_READ_MAX_ = 30000000;
const IMPORT_BATCH_ = 20;
const TEXT_LIMITS_ = { title: 200, text: 10000, name: 100, people: 200 };

let authToken = '', authLost = false, authGen = 0;
let me = null, can = null, attachMode = 'stopped';
let employees = null;              // 参加者の選択肢（リーダー以上が編集を開いたときに取る）
let listData = [], detail = null, attendance = [], checkedIn = false;
let editingId = '';                // 編集中の議事録（新規でも、本文を保存できたら ID が入る）
let selP = new Set(), selN = new Set(), legacyP = [], legacyN = [], knownNames = {};
let pendingFiles = {};             // 項目 → { file, requestId, prepared, baseVer }（同じ選択の送り直しは同じ requestId と版＝GAS でファイルが増えない）
let fieldVer = {};                 // 項目 → 欄の版（編集を開いたときの詳細の ver。添付が付いたら新しい版にする）
let objectUrls = [];               // 作った Blob の URL（画面を移るとき・入場券を断られたときに解放）
let convertJobs = [];              // ★2026-11-04 R07 画像の変換中（reencode_）の一時 URL。入場券を断られたら、変換の完了を待たずに解放する
let viewSeq = 0, listSeq = 0;      // 画面を移ったら増やす（前の画面への遅い応答を使わない）
let inflightWrites = 0;            // 送ったが結果がまだの書き込み

// ---------------------------------------------------------------- 入場券（#sso=）
(function takeTicket_() {
  let t = '';
  try {
    const u = new URL(window.location.href);
    t = new URLSearchParams(u.hash.replace(/^#/, '')).get('sso') || '';
    // 入場券・旧の ?sso=・接続先の引数（?benkyokai_gas_url=）は、URL からすぐ消す（旧の値は使わない）
    u.hash = '';
    ['sso', 'benkyokai_gas_url'].forEach(function (k) { u.searchParams.delete(k); });
    history.replaceState(null, '', u.pathname + u.search);
  } catch (e) { t = ''; }
  authToken = (typeof t === 'string' && t.length <= 2048 && TOKEN_RE_.test(t)) ? t : '';
})();

// ---------------------------------------------------------------- 小さな部品
const $ = function (id) { return document.getElementById(id); };
function el_(tag, opts, children) {
  const e = document.createElement(tag);
  if (opts) {
    if (opts.cls) e.className = opts.cls;
    if (opts.text !== undefined) e.textContent = opts.text;
    if (opts.type) e.type = opts.type;
    if (opts.data) Object.keys(opts.data).forEach(function (k) { e.dataset[k] = opts.data[k]; });
    if (opts.title) e.title = opts.title;
  }
  (children || []).forEach(function (c) { e.appendChild(c); });
  return e;
}
function msgEl_(text) { return el_('div', { cls: 'attend-empty', text: text }); }
function codeErr_(code) { const e = new Error(code); e.code = code; return e; }
let toastTimer = null;
function showToast(msg, type) {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast' + (type ? ' ' + type : '');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, type === 'error' ? 7000 : 2800);
}
function showLoading(msg) { $('loading').textContent = msg || '処理中...'; $('loading').classList.remove('hid'); }
function hideLoading() { $('loading').classList.add('hid'); }
function isStr_(v, max) { return typeof v === 'string' && v.length <= (max || 100000); }
function isObj_(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
function quiet_(e) { return e && (e.code === 'stale' || e.code === 'unauthorized'); }   // 断られたことはバナーで伝える

function errText_(code, isWrite) {
  const notSaved = isWrite ? '保存はしていません。' : '';
  switch (code) {
    case 'unauthorized': return 'ログインの期限が切れたか、使えない入場券です。ポータルから開き直してください。';
    case 'unavailable': return 'いまログインを確かめられません（一時的）。少し待ってからやり直してください。' + notSaved;
    case 'busy': return '混み合っています。少し待ってからやり直してください。' + notSaved;
    case 'network': return '通信できませんでした。もう一度やり直してください。';
    case 'bad_response': return '応答の形が正しくありません。もう一度やり直してください。';
    case 'write_unknown': case 'operation_failed':
      return isWrite ? '保存の結果を確かめられません。詳細・一覧を開き直して確かめてから、必要ならもう一度保存してください。' : 'うまくいきませんでした。もう一度やり直してください。';
    case 'invalid_data': return '受け付けられない入力があります（「=」で始まる値・長すぎる文字・使えない文字・選べない人 など）。' + notSaved;
    case 'limit_exceeded': return '件数または大きさが上限を超えています。' + notSaved;
    case 'not_found': return '議事録または添付が見つかりません（消えたか、差し替えられた可能性があります）。';
    case 'sheet_unavailable': case 'schema_mismatch': return 'シートが見つからないか、列が想定と違います（管理者に連絡してください）。' + notSaved;
    case 'attachments_stopped': return '添付は今は止めています。';
    case 'attach_not_configured': return '添付の保存先が設定されていません（管理者に連絡してください）。' + notSaved;
    case 'attach_folder_shared': return '添付の保存先が共有されているため、添付を保存しませんでした（管理者に連絡してください）。';
    case 'attach_unverifiable': return '添付の保存先の共有を確かめられないため、添付を保存しませんでした（管理者に連絡してください）。';
    case 'attach_pending': return '添付を保存できたかを、まだ確かめられていません（二重にはなりません）。1分ほど待ってから、もう一度「保存」を押して確かめてください。';
    case 'attach_undetermined': return '添付を保存できたかを確定できなかったため、止めました（同じファイルを送っても二重にはしません）。管理者に連絡してください。';
    case 'attach_conflict': return 'この欄の添付は、ほかの保存で先に変わっていたため、置き換えていません。詳細を開き直して確かめてください。';
    case 'not_configured': return '接続先が設定されていないため、通信していません（生成の設定を確かめてください）。';
    case 'file_type': return 'この種類のファイルは添付できません（写真は画像、資料は PDF か画像）。';
    case 'file_large': return 'ファイルが大きすぎます（写真は 3MB・PDF は 5MB まで）。';
    default: return 'うまくいきませんでした。もう一度やり直してください。';
  }
}

// ---------------------------------------------------------------- 通信（POST だけ・接続先は固定）
async function gasCall_(action, payload) {
  const spec = Object.prototype.hasOwnProperty.call(ACTIONS_, action) ? ACTIONS_[action] : null;
  if (!spec) throw codeErr_('bad_response');
  if (!GAS_URL_RE_.test(BENKYOKAI_GAS_URL)) throw codeErr_('not_configured');
  if (authLost || !authToken) throw codeErr_('unauthorized');
  const gen = authGen;
  const body = JSON.stringify(Object.assign({}, payload || {}, { action: action, token: authToken }));
  const fail = spec.write ? 'write_unknown' : 'network';
  if (spec.write) inflightWrites++;
  const controller = new AbortController();
  const timer = setTimeout(function () { controller.abort(); }, spec.timeout);
  let res;
  try {
    let r, text;
    try {
      r = await fetch(BENKYOKAI_GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body,
        credentials: 'omit', referrerPolicy: 'no-referrer', cache: 'no-store', redirect: 'follow', signal: controller.signal });
      text = r.ok ? await r.text() : '';
    } catch (e) { throw codeErr_(gen !== authGen ? 'stale' : fail); }
    if (gen !== authGen) throw codeErr_('stale');          // 断られたあとに届いた応答は使わない
    if (!r.ok) throw codeErr_(fail);
    try { res = JSON.parse(text); } catch (e) { throw codeErr_(spec.write ? 'write_unknown' : 'bad_response'); }   // ログインの画面・空の応答
  } finally {
    clearTimeout(timer);
    if (spec.write) inflightWrites--;
  }
  if (!isObj_(res) || (res.ok !== true && res.ok !== false)) throw codeErr_(spec.write ? 'write_unknown' : 'bad_response');
  if (res.ok === false) {
    const code = typeof res.error === 'string' ? res.error : '';
    if (code === 'unauthorized') { onAuthLost_(); throw codeErr_('unauthorized'); }
    if (KNOWN_ERRORS_.indexOf(code) >= 0) throw codeErr_(code);
    throw codeErr_(spec.write ? 'write_unknown' : 'bad_response');
  }
  return res;
}

// ---------------------------------------------------------------- 入場券が使えなくなったとき
function onAuthLost_() {
  if (authLost) return;
  const unsure = inflightWrites > 0 || busy;
  authLost = true; authToken = ''; authGen++; viewSeq++; listSeq++;
  me = null; can = null; employees = null; listData = []; detail = null; attendance = []; checkedIn = false;
  editingId = ''; selP = new Set(); selN = new Set(); legacyP = []; legacyN = []; knownNames = {}; pendingFiles = {}; fieldVer = {};
  clearForm_();
  releaseObjectUrls_();
  cancelConversions_();   // ★2026-11-04 R07
  closeViewer_();
  $('csv-import-input').value = '';
  ['d-title', 'd-datetime', 'd-creator', 'd-participants', 'd-notify', 'd-content', 'd-decisions', 'd-issues', 'd-nextdate'].forEach(function (id) { $(id).textContent = '-'; });
  $('d-photos').replaceChildren(); $('d-files').replaceChildren(); $('attend-list').replaceChildren();
  $('list-container').replaceChildren(msgEl_('ログインし直してください（ポータルから開き直すと一覧を取得できます）'));
  $('view-detail').classList.add('hid'); $('view-list').classList.remove('hid');
  hideLoading();
  showBanner_(errText_('unauthorized') + (unsure ? '　送っていた保存・参加・添付・取込の結果は確かめられていません。開き直してから確かめてください。' : ''), false);
  renderTopbar_(); setControls_();
}

// ---------------------------------------------------------------- 起動
function validWho_(r) {
  if (!isObj_(r.user) || !isStr_(r.user.id, 100) || !isStr_(r.user.name, 100) || !Object.prototype.hasOwnProperty.call(ROLE_LABELS_, r.user.role)) return false;
  if (!isObj_(r.can)) return false;
  return ['view', 'checkIn', 'edit', 'upload', 'export', 'import'].every(function (k) { return typeof r.can[k] === 'boolean'; }) &&
    (r.attachments === 'protected' || r.attachments === 'stopped');
}

async function boot_() {
  if (!GAS_URL_RE_.test(BENKYOKAI_GAS_URL)) { showBanner_(errText_('not_configured'), false); renderTopbar_(); setControls_(); $('list-container').replaceChildren(); return; }
  if (!authToken) { showBanner_('ポータルから開いてください（入場券がありません）。', false); renderTopbar_(); setControls_(); $('list-container').replaceChildren(); return; }
  hideBanner_();
  renderTopbar_('確認中…');
  let who;
  try { who = await gasCall_('whoami', {}); }
  catch (e) {
    if (quiet_(e)) return;
    showBanner_(errText_(e.code), true); renderTopbar_(); setControls_(); $('list-container').replaceChildren();
    return;
  }
  if (!validWho_(who)) { showBanner_(errText_('bad_response'), true); return; }
  me = { id: who.user.id, name: who.user.name, role: who.user.role };
  can = Object.assign({}, who.can);
  attachMode = who.attachments;
  renderTopbar_(); setControls_();
  if (can.view) loadList_();
  else $('list-container').replaceChildren(msgEl_('この議事録を見る権限がありません'));
}

// ---------------------------------------------------------------- 一覧
function validListItem_(m) {
  return isObj_(m) && UUID_RE_.test(m.id) && isStr_(m.title, 200) && isStr_(m.createdAt, 64) && isStr_(m.nextDate, 64) &&
    isStr_(m.creatorName, 100) && Number.isSafeInteger(m.attendanceCount) && m.attendanceCount >= 0;
}

async function loadList_() {
  const seq = ++listSeq;
  const c = $('list-container');
  c.replaceChildren(msgEl_('読み込み中...'));
  let res;
  try { res = await gasCall_('getMinutesList', {}); }
  catch (e) { if (quiet_(e) || seq !== listSeq) return; c.replaceChildren(msgEl_('読み込みエラー: ' + errText_(e.code))); return; }
  if (seq !== listSeq) return;
  if (!Array.isArray(res.data)) { c.replaceChildren(msgEl_(errText_('bad_response'))); return; }
  listData = res.data.filter(validListItem_);
  if (!listData.length) { c.replaceChildren(msgEl_('まだ議事録がありません')); return; }
  c.replaceChildren.apply(c, listData.map(function (m) {
    const item = el_('div', { cls: 'list-item', data: { id: m.id } }, [
      el_('div', null, [
        el_('div', { cls: 'list-item-title', text: m.title || '(無題)' }),
        el_('div', { cls: 'list-item-sub', text: '開催: ' + fmtDateTime_(m.createdAt) + '　次回予定: ' + (m.nextDate || '-') + '　作成者: ' + (m.creatorName || '-') })
      ]),
      el_('div', { cls: 'list-item-badge', text: '参加 ' + m.attendanceCount + '人' })
    ]);
    item.tabIndex = 0;
    item.setAttribute('role', 'button');
    return item;
  }));
}

function backToList_() {
  viewSeq++;
  releaseObjectUrls_(); closeViewer_();
  detail = null; editingId = ''; pendingFiles = {};
  showView_('list'); setControls_();
  if (can && can.view && !authLost) loadList_();
}

// ---------------------------------------------------------------- 詳細
function validPeople_(a) {
  return Array.isArray(a) && a.length <= TEXT_LIMITS_.people && a.every(function (p) { return isObj_(p) && isStr_(p.id, 100) && isStr_(p.name, 100); });
}
function validAtt_(a) {
  if (!isObj_(a)) return false;
  if (a.ver !== undefined && !(typeof a.ver === 'string' && VER_RE_.test(a.ver))) return false;
  if (a.state === 'none' || a.state === 'unverified' || a.state === 'stopped') return true;
  return a.state === 'attached' && UUID_RE_.test(a.attId) && (a.kind === 'image' || a.kind === 'pdf') && Number.isSafeInteger(a.bytes);
}
function validDetail_(res, id) {
  const d = res.data;
  if (!isObj_(d) || d.id !== id) return false;
  if (!['title', 'createdAt', 'endAt', 'creatorName', 'content', 'decisions', 'issues', 'nextDate'].every(function (k) { return isStr_(d[k], 40000); })) return false;
  if ((d.origin !== 'app' && d.origin !== 'import') || !validPeople_(d.participants) || !validPeople_(d.notifyOthers) || !isObj_(d.attachments)) return false;
  if (!FIELDS_.every(function (f) { return validAtt_(d.attachments[f[0]]); })) return false;
  return Array.isArray(res.attendance) && res.attendance.every(function (a) { return isObj_(a) && isStr_(a.name, 100) && isStr_(a.at, 64); }) &&
    typeof res.checkedIn === 'boolean';
}

async function openDetail_(id) {
  if (!UUID_RE_.test(id) || !can || authLost) return;
  const seq = ++viewSeq;
  releaseObjectUrls_(); closeViewer_();
  detail = null; editingId = ''; pendingFiles = {};
  showView_('detail'); setControls_();
  ['d-title', 'd-datetime', 'd-creator', 'd-participants', 'd-notify', 'd-content', 'd-decisions', 'd-issues', 'd-nextdate'].forEach(function (k) { $(k).textContent = '-'; });
  $('d-files').replaceChildren(); $('attend-list').replaceChildren();
  showLoading('読み込み中...');
  let res;
  try { res = await gasCall_('getMinutesDetail', { minutesId: id }); }
  catch (e) { if (seq === viewSeq) hideLoading(); if (quiet_(e) || seq !== viewSeq) return; showToast('読み込みエラー: ' + errText_(e.code), 'error'); return; }
  if (seq !== viewSeq) return;
  hideLoading();
  if (!validDetail_(res, id)) { showToast(errText_('bad_response'), 'error'); return; }

}

function attNote_(a) {
  if (a.state === 'unverified') return '確認できない古い添付（表示しません）';

}

  }));
}

// ---------------------------------------------------------------- 添付（GAS が入場券を確かめて返した中身だけを Blob で出す）
function b64ToBytes_(s) {
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToB64_(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function magicOk_(b, mime) {
  if (mime === 'image/png') return b.length > 8 && b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47;
  if (mime === 'image/jpeg') return b.length > 3 && b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff;
  if (mime === 'application/pdf') return b.length > 5 && b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46 && b[4] === 0x2d;
  return false;
}
async function fetchAttachment_(minutesId, a, kind) {
  const res = await gasCall_('getAttachment', { minutesId: minutesId, attId: a.attId });

function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// ★2026-11-09 N07：開催日時・終了日時を「2026/11/09(月) 18:19」の形で出す（保存の値は世界標準時の文字のまま。表示だけ）。
//   時刻は入力欄（toLocalInput）と同じ端末の時刻。読めない値はそのまま出す。終了が同じ日なら時刻だけ。
function dtParts_(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  const p = function (n) { return String(n).padStart(2, '0'); };
  return {
    date: d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + '(' + '日月火水木金土'.charAt(d.getDay()) + ')',
    time: p(d.getHours()) + ':' + p(d.getMinutes())
  };
}
function fmtDateTime_(iso) {
  const t = dtParts_(iso);
  return t ? t.date + ' ' + t.time : (iso ? String(iso) : '-');
}
function fmtRange_(startIso, endIso) {
  const s = dtParts_(startIso), e = dtParts_(endIso);
  const right = e ? ((s && s.date === e.date) ? e.time : e.date + ' ' + e.time) : (endIso ? String(endIso) : '-');
  return fmtDateTime_(startIso) + '　〜　' + right;
}

function reencode_(file) {
  return new Promise(function (resolve, reject) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    // ★2026-11-04 R07：URL は作った直後から管理する。終わらせるのは1回だけ（遅いコールバック・再度の後始末では何もしない）
    const job = { ended: false };
    const end = function () {
      if (job.ended) return false;
      job.ended = true;
      convertJobs = convertJobs.filter(function (j) { return j !== job; });
      try { URL.revokeObjectURL(url); } catch (e) {}
      return true;
    };
    job.cancel = function () { if (end()) reject(codeErr_('stale')); };
    convertJobs.push(job);
    img.onload = function () {
      if (job.ended) return;   // 断られたあとの完了は使わない
      try {
        const w0 = img.naturalWidth, h0 = img.naturalHeight;
        if (!w0 || !h0) throw codeErr_('file_type');
        const s = Math.min(1, IMG_MAX_SIDE_ / Math.max(w0, h0));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w0 * s)); cv.height = Math.max(1, Math.round(h0 * s));
        const g = cv.getContext('2d');
        g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height);
        g.drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(function (b) { if (!end()) return; if (b) resolve(b); else reject(codeErr_('file_type')); }, 'image/jpeg', IMG_QUALITY_);
      } catch (e) { if (end()) reject(e && e.code ? e : codeErr_('file_type')); }
    };
    img.onerror = function () { if (end()) reject(codeErr_('file_type')); };
    img.src = url;
  });
}

// 画像は端末で JPEG に描き直す（長い辺 1600 画素まで・位置情報などの付属情報は残らない）。資料の PDF はそのまま
async function prepareFile_(field, file) {
  const name = String(file.name || '').toLowerCase();
  const isPdf = file.type === 'application/pdf' || /\.pdf$/.test(name);
  if (isPdf) {
    if (field !== 'material') throw codeErr_('file_type');
    if (file.size > PDF_MAX_BYTES_) throw codeErr_('file_large');
    const bytes = new Uint8Array(await file.arrayBuffer());
    if (!magicOk_(bytes, 'application/pdf')) throw codeErr_('file_type');
    return { mime: 'application/pdf', base64: bytesToB64_(bytes) };
  }
  if (file.size > FILE_READ_MAX_) throw codeErr_('file_large');
  const blob = await reencode_(file);
  if (blob.size > IMG_MAX_BYTES_) throw codeErr_('file_large');
  const bytes = new Uint8Array(await blob.arrayBuffer());
  if (!magicOk_(bytes, 'image/jpeg')) throw codeErr_('file_type');
  return { mime: 'image/jpeg', base64: bytesToB64_(bytes) };
}

// 入力の確かめ（GAS も同じ決まりで確かめる。ここは知らせるためだけ）
function textProblem_(v, max, multiline) {
  if (v.length > max) return '長すぎます（' + max + '文字まで）';
  if (/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/.test(v)) return '使えない文字が入っています';
  if (!multiline && /[\r\n\t]/.test(v)) return '改行やタブは入れられません';
  if (/^\s*=/.test(v)) return '「=」で始まる値は入れられません（先頭に全角の文字などを入れてください）';
  return '';
}

function readForm_() {
  const v = {
    title: $('f-title').value.trim(), createdAt: $('f-createdAt').value, endAt: $('f-endAt').value,
    content: $('f-content').value.replace(/\r\n?/g, '\n'), decisions: $('f-decisions').value.replace(/\r\n?/g, '\n'),
    issues: $('f-issues').value.replace(/\r\n?/g, '\n'), nextDate: $('f-nextDate').value
  };
  if (!v.createdAt || !v.endAt) return { error: '開催日時・終了日時は必須です' };
  if (!v.nextDate) return { error: '次回予定日は必須です' };
  const s = new Date(v.createdAt), e = new Date(v.endAt);
  if (isNaN(s.getTime()) || isNaN(e.getTime()) || !/^\d{4}-\d{2}-\d{2}$/.test(v.nextDate)) return { error: '日時の形が正しくありません' };
  for (const [k, label, max, ml] of [['title', 'タイトル', TEXT_LIMITS_.title, false], ['content', '内容', TEXT_LIMITS_.text, true], ['decisions', '決定事項', TEXT_LIMITS_.text, true], ['issues', '課題・困りごと', TEXT_LIMITS_.text, true]]) {
    const p = textProblem_(v[k], max, ml);

  if (selP.size > TEXT_LIMITS_.people || selN.size > TEXT_LIMITS_.people) return { error: '選べるのは200人までです' };

}

async function saveForm_() {
  if (!can || !can.edit || busy || authLost) return;
  const f = readForm_();

  const v = f.value, gen = authGen;
  const record = { title: v.title, createdAt: v.createdAt, endAt: v.endAt, participantIds: Array.from(selP), notifyIds: Array.from(selN),
    content: v.content, decisions: v.decisions, issues: v.issues, nextDate: v.nextDate };
  if (editingId) record.id = editingId;
  busy = true; setControls_(); showLoading('保存中...');
  let id;
  try {
    const res = await gasCall_('saveMinutes', { record: record });
    if (!UUID_RE_.test(res.id) || (editingId && res.id !== editingId)) throw codeErr_('write_unknown');
    id = res.id;
  } catch (e) {
    busy = false; hideLoading(); setControls_();
    if (!quiet_(e)) showToast(errText_(e.code, true), 'error');
    return;
  }
  if (authLost || gen !== authGen) { busy = false; hideLoading(); setControls_(); return; }   // ★2026-11-04 R06：断られたあとの応答をメモリへ戻さない
  editingId = id;   // ここから先の「保存」は、この議事録の更新になる（新規を二重に作らない）
  const failed = [];
  for (const [field, label] of FIELDS_) {
    const p = pendingFiles[field];
    if (!p) continue;
    if (authLost || gen !== authGen) break;
    if (!attachUsable_()) { failed.push(label + '（' + errText_('attachments_stopped') + '）'); continue; }
    showLoading('添付を送っています：' + label);
    try {
      // 1回作った中身を取っておき、送り直しでも同じ中身を同じ requestId で送る（GAS は同じ添付として扱う）
      const prepared = p.prepared || (p.prepared = await prepareFile_(field, p.file));
      if (authLost || gen !== authGen) break;
      const r = await gasCall_('uploadPhoto', { minutesId: id, field: field, requestId: p.requestId, baseVer: p.baseVer, mimeType: prepared.mime, base64: prepared.base64 });
      if (r.field !== field || r.state !== 'attached' || !UUID_RE_.test(r.attId)) throw codeErr_('write_unknown');
      if (authLost || gen !== authGen) break;   // ★2026-11-04 R06
      fieldVer[field] = typeof r.ver === 'string' && VER_RE_.test(r.ver) ? r.ver : '';   // 次にこの欄へ選ぶときの版
      if (pendingFiles[field] === p) { delete pendingFiles[field]; $('f-' + field).value = ''; }
    } catch (e) {
      if (quiet_(e)) break;
      if (e.code === 'attach_conflict' || e.code === 'attach_undetermined') {
        // ほかの保存で欄が変わっていた（開き直して、見てから選び直す）／作れたかを確定できない（人が確かめるまで進まない）：この添付は送り直さない
        if (pendingFiles[field] === p) { delete pendingFiles[field]; $('f-' + field).value = ''; }
      } else if (e.code === 'attach_folder_shared' || e.code === 'attach_unverifiable') {
        p.requestId = newRequestId_();   // GAS がこの requestId を断った：次の「保存」は新しく送る
      }
      failed.push(label + '（' + errText_(e.code, true) + '）');
    }
  }
  busy = false; hideLoading(); setControls_();
  if (authLost || gen !== authGen) return;   // 断られたあとは成功の知らせを出さない（バナーで結果不明を伝えている）
  if (failed.length) {
    const retry = FIELDS_.some(function (f) { return pendingFiles[f[0]]; });
    showToast('本文は保存しました。添付のうち ' + failed.join('・') + ' は保存できていません。' +
      (retry ? 'もう一度「保存」を押すと、残っている添付だけを送り直します（同じ添付は二重になりません）。' : ''), 'error');
    return;
  }
  showToast('保存しました', 'success');
  openDetail_(id);
}

// ---------------------------------------------------------------- CSV取込（キントーンの記録の移行・管理者以上）
function parseCsvText(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else if (c !== '\r') field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* \r\n の \r は無視 */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseKintoneDateTime(s) {
  if (!s) return new Date().toISOString();
  const m = String(s).trim().match(/(\d{4})\/(\d{1,2})\/(\d{1,2})[ T]?(\d{1,2})?:?(\d{1,2})?/);
  if (!m) return new Date().toISOString();
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(m[4] || 0), Number(m[5] || 0));
  return isNaN(d.getTime()) ? new Date().toISOString() : d.toISOString();
}
function parseKintoneDateOnly(s) {
  if (!s) return '';
  const m = String(s).trim().match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if (!m) return '';
  const p = function (n) { return String(n).padStart(2, '0'); };
  return m[1] + '-' + p(m[2]) + '-' + p(m[3]);
}

async function handleCsvImportFile_(file) {
  if (!file || !can || !can.import || busy || authLost) return;
  const gen = authGen;
  busy = true; setControls_(); showLoading('CSVを読み込み中...');
  let records = [], problems = [];
  try {
    if (file.size > 20000000) throw codeErr_('file_large');
    const buf = await file.arrayBuffer();
    // kintoneの標準エクスポートはShift-JIS。文字化けが多ければUTF-8として読み直す。
    let text = new TextDecoder('shift_jis').decode(buf);
    if ((text.match(/�/g) || []).length > 5) text = new TextDecoder('utf-8').decode(buf);
    const rows = parseCsvText(text).filter(function (r) { return r.some(function (v) { return v && v.trim(); }); });
    if (rows.length < 2) throw codeErr_('csv_empty');
    const headers = rows[0].map(function (h) { return h.trim(); });
    const col = function (name) { return headers.indexOf(name); };
    const idx = { title: col('タイトル'), creator: col('作成者'), createdAt: col('作成日時'), endAt: col('終了日時'), participants: col('参加者'),
      notify: col('参加者以外の通知先'), decisions: col('決定事項'), content: col('内容'), issues: col('課題・困りごと'), nextDate: col('次回予定日') };
    if (idx.title < 0 || idx.content < 0) throw codeErr_('csv_columns');
    const at = function (r, i) { return i >= 0 ? (r[i] || '') : ''; };
    const splitLines = function (s) { return String(s || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean); };
    rows.slice(1).forEach(function (r, i) {
      const rec = {
        title: at(r, idx.title).trim(), creatorName: at(r, idx.creator).split('\n')[0].trim(),
        createdAt: parseKintoneDateTime(at(r, idx.createdAt)), endAt: parseKintoneDateTime(at(r, idx.endAt)),
        participantNames: splitLines(at(r, idx.participants)), notifyNames: splitLines(at(r, idx.notify)),
        content: at(r, idx.content), decisions: at(r, idx.decisions), issues: at(r, idx.issues), nextDate: parseKintoneDateOnly(at(r, idx.nextDate))
      };
      const why = [];
      [['title', 'タイトル', TEXT_LIMITS_.title, false], ['creatorName', '作成者', TEXT_LIMITS_.name, false], ['content', '内容', TEXT_LIMITS_.text, true],
        ['decisions', '決定事項', TEXT_LIMITS_.text, true], ['issues', '課題・困りごと', TEXT_LIMITS_.text, true]].forEach(function (c) {
        const p = textProblem_(rec[c[0]], c[2], c[3]); if (p) why.push(c[1] + '：' + p);
      });
      [['participantNames', '参加者'], ['notifyNames', '通知先']].forEach(function (c) {
        if (rec[c[0]].length > TEXT_LIMITS_.people) why.push(c[1] + '：200人まで');
        rec[c[0]].forEach(function (n) { const p = textProblem_(n, TEXT_LIMITS_.name, false); if (p) why.push(c[1] + '「' + n.slice(0, 20) + '」：' + p); });
      });
      if (why.length) problems.push((i + 1) + '行目：' + why.join('、'));
      records.push(rec);
    });
  } catch (e) {
    busy = false; hideLoading(); setControls_(); $('csv-import-input').value = '';
    if (authLost || gen !== authGen) return;
    showToast(e.code === 'csv_columns' ? 'CSVの列構成が想定と異なります(タイトル・内容列が見つかりません)' : e.code === 'csv_empty' ? '取り込めるデータが見つかりません' :
      e.code === 'file_large' ? 'CSVが大きすぎます' : 'CSVを読めませんでした', 'error');
    return;
  }
  hideLoading();
  if (authLost || gen !== authGen) { busy = false; setControls_(); return; }
  if (problems.length) {
    busy = false; setControls_(); $('csv-import-input').value = '';
    showToast('取り込めない行があります（' + problems.length + '件・取込はしていません。行の番号は見出しを除いて数えています）：' + problems.slice(0, 5).join(' ／ ') + (problems.length > 5 ? ' ほか' : ''), 'error');
    return;
  }
  if (!window.confirm(records.length + '件を取り込みます（キントーンの記録の移行）。同じ CSV を2回取り込むと、同じ議事録が2件ずつになります。よろしいですか？')) {
    busy = false; setControls_(); $('csv-import-input').value = '';
    return;
  }
  let done = 0, stop = '';
  for (let i = 0; i < records.length; i += IMPORT_BATCH_) {
    if (authLost || gen !== authGen) break;
    const batch = records.slice(i, i + IMPORT_BATCH_);
    showLoading('CSV取込中... (' + done + '/' + records.length + '件)');
    try {
      const r = await gasCall_('importMinutes', { records: batch });
      if (r.count !== batch.length) throw codeErr_('write_unknown');
      done += r.count;
    } catch (e) {
      if (quiet_(e)) break;
      stop = e.code === 'write_unknown' || e.code === 'operation_failed'
        ? (i + 1) + '〜' + (i + batch.length) + '件目の結果は確かめられません。' + (i + batch.length + 1 <= records.length ? (i + batch.length + 1) + '件目からは取り込んでいません。' : '') + '一覧で確かめてから、残りの行だけの CSV で取り込み直してください。'
        : (i + 1) + '件目からは取り込んでいません（' + errText_(e.code, false) + '）。';
      break;
    }
  }
  busy = false; hideLoading(); setControls_(); $('csv-import-input').value = '';
  if (authLost || gen !== authGen) return;
  if (stop) showToast('CSV取込：' + done + '件まで取り込みました。' + stop, 'error');
  else showToast('CSV取込完了: ' + done + '件', 'success');
  loadList_();
}

// ---------------------------------------------------------------- CSV書き出し（リーダー以上）
// セルの先頭が = + - @ タブ CR のときは ' を付けて文字として出す（Excel で式として動かないように）。添付は URL ではなく状態だけ
function csvCell_(v) {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
const ATT_TEXT_ = { none: '', attached: '添付あり', unverified: '確認できない古い値（出していません）', stopped: '添付は止めています' };

async function exportCsv_() {
  if (!can || !can.export || busy || authLost) return;
  const gen = authGen;
  busy = true; setControls_(); showLoading('CSVを作成中...');
  try {
    const res = await gasCall_('getMinutesExport', {});
    if (!Array.isArray(res.data)) throw codeErr_('bad_response');
    if (authLost || gen !== authGen) return;
    const headers = ['タイトル', '開催日時', '終了日時', '作成者', '参加者(手動)', '参加者以外の通知先',
      '内容', '決定事項', '課題・困りごと', '次回予定日', '参加ログ(自己申告)',
      '改善状況写真1', '改善状況写真2', '改善状況写真3', '勉強会資料', '勉強会の様子'];
    const lines = [headers.map(csvCell_).join(',')];
    res.data.forEach(function (d) {
      if (!isObj_(d)) return;
      const att = isObj_(d.attachments) ? d.attachments : {};
      lines.push([d.title, d.createdAt, d.endAt, d.creatorName, d.participants, d.notifyOthers, d.content, d.decisions, d.issues, d.nextDate, d.attendanceLog]
        .map(function (x) { return typeof x === 'string' ? x : ''; })
        .concat(FIELDS_.map(function (f) { return Object.prototype.hasOwnProperty.call(ATT_TEXT_, att[f[0]]) ? ATT_TEXT_[att[f[0]]] : ''; }))
        .map(csvCell_).join(','));
    });
    const csv = '﻿' + lines.join('\r\n'); // UTF-8 BOM付き(Excelでの文字化け防止)
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    const a = el_('a');
    a.href = url; a.download = '実習生勉強会の議事録_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast('CSVを書き出しました', 'success');
  } catch (e) {
    if (!quiet_(e)) showToast('エラー: ' + errText_(e.code), 'error');
  } finally {
    busy = false; hideLoading(); setControls_();
  }
}

// ---------------------------------------------------------------- ボタン
function bindEvents_() {
  $('btn-close-tab').addEventListener('click', function () {
    try { window.close(); } catch (e) {}
    setTimeout(function () { showToast('このタブは手動で閉じてください', ''); }, 300);
  });
  $('btn-retry').addEventListener('click', function () { if (!authLost) boot_(); });
  $('btn-import').addEventListener('click', function () { if (can && can.import && !busy && !authLost) $('csv-import-input').click(); });
  $('csv-import-input').addEventListener('change', function () { const f = this.files && this.files[0]; if (f) handleCsvImportFile_(f); });
  $('btn-export').addEventListener('click', exportCsv_);
  $('btn-new').addEventListener('click', function () { openForm_(true); });
  $('btn-back').addEventListener('click', backToList_);
  $('btn-edit').addEventListener('click', function () { if (detail) openForm_(false); });
  $('btn-delete').addEventListener('click', doDelete_);
  $('btn-checkin').addEventListener('click', doCheckIn_);
  $('btn-save').addEventListener('click', saveForm_);
  $('btn-cancel').addEventListener('click', cancelEdit_);
  $('btn-viewer-close').addEventListener('click', closeViewer_);
  $('viewer').addEventListener('click', function (ev) { if (ev.target === this) closeViewer_(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeViewer_(); });
  const list = $('list-container');
  const open = function (ev) {
    const item = ev.target.closest('.list-item');
    if (item && UUID_RE_.test(item.dataset.id || '')) openDetail_(item.dataset.id);
  };
  list.addEventListener('click', open);
  list.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(ev); } });
  $('picker-participants').addEventListener('click', function (ev) { togglePicker_(ev, selP); });
  $('picker-notify').addEventListener('click', function (ev) { togglePicker_(ev, selN); });
  FIELDS_.forEach(function (f) { $('f-' + f[0]).addEventListener('change', function () { onFileChosen_(this); }); });
}

bindEvents_();
setControls_();
boot_();
</script>
